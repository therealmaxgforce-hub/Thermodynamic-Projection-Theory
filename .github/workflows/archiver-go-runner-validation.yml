name: ARCHIVER Native Go Windows Runner Validation

on:
  push:
    branches:
      - archiver-go-runner-validation
    paths:
      - 'archiver_go_validation/**'
      - '.github/workflows/archiver-go-runner-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'archiver_go_validation/**'
      - '.github/workflows/archiver-go-runner-validation.yml'
  workflow_dispatch:

jobs:
  validate-native-go:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build native Windows EXE
        shell: cmd
        run: go build -trimpath -ldflags="-s -w" -o archiver_go_validation\validation.exe archiver_go_validation\main.go
      - name: Execute native Windows plumbing validation
        shell: cmd
        run: archiver_go_validation\validation.exe
